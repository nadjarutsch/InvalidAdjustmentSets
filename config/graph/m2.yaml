id: m2

variables:
  - name: A
  - name: Y
  - name: O1
  - name: O2
  - name: W1
  - name: C1

edges:
  - effect: C1
    equation: "6*O1 + 1.33*W1"
  - effect: A
    equation: "0.55*W1 + 1.1*O2"
  - effect: Y
    equation: "0.29*A + 0.71*O1 + 0.14*O2"




# true average treatment effect of A on Y
treatment_effect: 0.29

# sample sizes of the experiments
sample_sizes: [10, 20, 30, 40, 50, 100, 150, 200, 1000]

# asymptotically optimal adjustment set O, used as the reference for bias estimation
reference_set: [O1, O2]

# reduced search space after applying the graphical criteria
candidates:
  - []
  - [O1]
  - [O2]
  - [C1]
  - [O1, O2]

# candidates that are valid adjustment sets
valid_sets:
  - [O2]
  - [O1, O2]
